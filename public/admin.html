<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Officer Panel - The Noble Standard Schools</title>
    <meta name="theme-color" content="#1F4E30">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon-192.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon-192.svg">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; }
        .admin-container { max-width: 1050px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { color: #1F4E30; margin: 0; font-size: 26px; }
        .logout-btn { background-color: #ef4444; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; display: inline-block; }
        .logout-btn:hover { background-color: #dc2626; }
        .install-btn {
            background: #1F4E30; color: white; border: none; border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer; display: none; margin-right: 8px;
        }
        .stats-bar { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #E2F0E5; padding: 15px 25px; border-radius: 8px; border-left: 5px solid #1F4E30; flex: 1; }
        .stat-card h3 { margin: 0; color: #1F4E30; font-size: 13px; text-transform: uppercase; }
        .stat-card p { margin: 5px 0 0 0; font-size: 26px; font-weight: bold; color: #333; }
        .controls-bar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
        .search-filters { display: flex; gap: 15px; flex: 1; min-width: 280px; }
        .search-filters input, .search-filters select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .search-filters input { flex: 2; min-width: 180px; }
        .search-filters select { flex: 1; min-width: 140px; }
        .bulk-btn { background-color: #16a34a; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; }
        .bulk-btn:hover { background-color: #15803d; }
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; white-space: nowrap; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #f1f5f9; color: #475569; font-weight: 600; }
        tr:hover { background-color: #f8fafc; }
        .action-container { display: flex; gap: 8px; align-items: center; }
        .action-btn { background-color: #2563eb; color: white; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: 600; display: inline-block; }
        .action-btn:hover { background-color: #1d4ed8; }
        .delete-btn { background-color: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; display: inline-block; }
        .delete-btn:hover { background-color: #b91c1c; }
        @media (max-width: 768px) {
            body { padding: 10px; }
            .admin-container { padding: 15px; margin: 10px auto; }
            .controls-bar { flex-direction: column; align-items: stretch; }
            .search-filters { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="header">
            <div>
                <h1>Exam Officer Control Dashboard</h1>
                <p style="color: #64748b; margin: 5px 0 0 0;">Review and optimize incoming papers for The Noble Standard Schools.</p>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <button id="installBtn" class="install-btn" type="button">Install App</button>
                <a href="/auth.html#login" class="logout-btn">Log Out</a>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-card">
                <h3>Total Papers Submitted</h3>
                <p id="total-papers-counter">0</p>
            </div>
        </div>

        <div class="controls-bar">
            <div class="search-filters">
                <input type="text" id="searchInput" placeholder="Search by subject or teacher name..." onkeyup="filterSubmissions()">
                <select id="gradeFilter" onchange="filterSubmissions()">
                    <option value="">All Classes / Grades</option>
                    <option value="JSS 1">JSS 1</option>
                    <option value="JSS 2">JSS 2</option>
                    <option value="JSS 3">JSS 3</option>
                    <option value="SSS 1">SSS 1</option>
                    <option value="SSS 2">SSS 2</option>
                    <option value="SSS 3">SSS 3</option>
                </select>
            </div>
            <button class="bulk-btn" onclick="triggerBulkDownload()">📥 Bulk Print Selected</button>
        </div>

        <h2>Incoming Papers Queue</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 40px;"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
                        <th>Date</th>
                        <th>Teacher Name</th>
                        <th>Subject</th>
                        <th>Class</th>
                        <th>Term</th>
                        <th>Session</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="admin-table-rows">
                    <tr>
                        <td colspan="8" style="text-align:center; color:#94a3b8;">Loading queue data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
    let allSubmissionsData = [];

    async function adminDelete(examId) {
        if (!confirm("Are you sure you want to delete this exam paper from the system queue?")) return;

        try {
            const response = await fetch('/api/admin/delete-exam', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ examId: examId })
            });
            const result = await response.json();

            if (result.success) {
                alert(result.message);
                location.reload();
            } else {
                alert("Deletion Failed: " + result.error);
            }
        } catch (err) {
            alert("Server connection error during deletion.");
        }
    }

    function toggleSelectAll(source) {
        const checkboxes = document.querySelectorAll('.exam-checkbox');
        checkboxes.forEach(cb => {
            if (cb.closest('tr').style.display !== 'none') {
                cb.checked = source.checked;
            }
        });
    }

    function filterSubmissions() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const selectedGrade = document.getElementById('gradeFilter').value.toLowerCase();
        const rows = document.querySelectorAll('#admin-table-rows tr');

        rows.forEach(row => {
            if (row.id === 'empty-row') return;
            const text = row.innerText.toLowerCase();
            const gradeAttr = row.getAttribute('data-grade')?.toLowerCase() || '';

            const matchesSearch = text.includes(searchText);
            const matchesGrade = !selectedGrade || gradeAttr.includes(selectedGrade);

            if (matchesSearch && matchesGrade) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    }

    async function triggerBulkDownload() {
        const checkedBoxes = document.querySelectorAll('.exam-checkbox:checked');
        if (checkedBoxes.length === 0) {
            alert("Please select at least one exam paper to bulk print.");
            return;
        }

        const examIds = Array.from(checkedBoxes).map(cb => cb.value);

        try {
            const response = await fetch('/api/admin/bulk-download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ examIds })
            });

            if (!response.ok) throw new Error("Failed to generate bulk print stream.");

            const htmlContent = await response.text();
            const newWindow = window.open('', '_blank');
            newWindow.document.write(htmlContent);
            newWindow.document.close();
        } catch (err) {
            alert("Bulk download error: " + err.message);
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('/api/submissions');
            allSubmissionsData = await response.json();

            const counterEl = document.getElementById('total-papers-counter');
            if (counterEl) {
                counterEl.textContent = allSubmissionsData.length;
            }

            const queueTableBody = document.getElementById('admin-table-rows');
            if (queueTableBody) {
                queueTableBody.innerHTML = '';

                if (!allSubmissionsData || allSubmissionsData.length === 0) {
                    queueTableBody.innerHTML = `<tr id="empty-row"><td colspan="8" style="text-align:center; color:#6b7280; padding:20px;">No exam papers submitted yet.</td></tr>`;
                    return;
                }

                allSubmissionsData.forEach(exam => {
                    const tr = document.createElement('tr');
                    const gradeValue = exam.grade || exam.school_class || 'N/A';
                    tr.setAttribute('data-grade', gradeValue);

                    const formattedDate = exam.created_at ? new Date(exam.created_at).toLocaleDateString() : 'N/A';

                    tr.innerHTML = `
                        <td><input type="checkbox" class="exam-checkbox" value="${exam.id}"></td>
                        <td>${formattedDate}</td>
                        <td>${exam.teacher_name || 'The Noble Standard Teacher'}</td>
                        <td>${exam.subject || 'N/A'}</td>
                        <td>${gradeValue}</td>
                        <td>${exam.term || 'N/A'}</td>
                        <td>${exam.session_year || 'N/A'}</td>
                        <td>
                            <div class="action-container">
                                <a href="/api/download/${exam.id}" target="_blank" class="action-btn">Optimize / Print</a>
                                <button class="delete-btn" onclick="adminDelete('${exam.id}')">Delete</button>
                            </div>
                        </td>
                    `;
                    queueTableBody.appendChild(tr);
                });
            }
        } catch (err) {
            console.error("Dashboard error:", err);
        }
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch((err) => console.error('Service worker registration failed:', err));
        });
    }

    let deferredPrompt = null;
    const installButton = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredPrompt = event;
        if (installButton) installButton.style.display = 'inline-block';
    });

    if (installButton) {
        installButton.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const choice = await deferredPrompt.userChoice;
            if (choice.outcome === 'accepted') console.log('PWA install accepted');
            deferredPrompt = null;
            installButton.style.display = 'none';
        });
    }
</script>
</body>
</html>
