<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Optimization System</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { color: #1e293b; margin-bottom: 8px; }
        p { color: #64748b; margin-bottom: 24px; }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-secondary { background-color: #e2e8f0; color: #334155; }
        .btn-secondary:hover { background-color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Exam Optimization Portal</h1>
        <p>Welcome to the School Examination Office portal. Please sign in or create an account to manage question submissions.</p>
        
        <div class="btn-group">
            <a href="auth.html#login" class="btn btn-primary">Login</a>
            <a href="auth.html#signup" class="btn btn-secondary">Sign Up</a>
        </div>
    </div>

</body>
</html>
