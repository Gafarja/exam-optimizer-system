<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Optimization Portal</title>
    <meta name="theme-color" content="#1F4E30">
    <meta name="description" content="Exam Optimizer System for teachers and exam officers">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon-192.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon-192.svg">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { color: #1e293b; margin-bottom: 8px; }
        p { color: #64748b; margin-bottom: 24px; }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-secondary { background-color: #e2e8f0; color: #334155; }
        .btn-secondary:hover { background-color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Exam Optimization Portal</h1>
        <p>Welcome to the School Examination Office portal. Please sign in or create an account to manage question submissions.</p>

        <div class="btn-group">
            <a href="auth.html#login" class="btn btn-primary">Login</a>
            <a href="auth.html#signup" class="btn btn-secondary">Sign Up</a>
            <button id="installAppBtn" class="btn btn-secondary" type="button" style="display:none;">Install App</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch((err) => {
                    console.error('Service worker registration failed:', err);
                });
            });
        }

        let deferredPrompt = null;
        const installAppBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (event) => {
            event.preventDefault();
            deferredPrompt = event;
            if (installAppBtn) installAppBtn.style.display = 'inline-block';
        });

        if (installAppBtn) {
            installAppBtn.addEventListener('click', async () => {
                if (!deferredPrompt) return;

                deferredPrompt.prompt();
                const choice = await deferredPrompt.userChoice;
                if (choice.outcome === 'accepted') {
                    console.log('App installation accepted');
                }
                deferredPrompt = null;
                installAppBtn.style.display = 'none';
            });
        }
    </script>
</body>
</html>
