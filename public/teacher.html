<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal - The Noble Standard Schools</title>
    <meta name="theme-color" content="#1F4E30">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon-192.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon-192.svg">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; }
        .dashboard-container { max-width: 850px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 25px; }
        h1 { color: #1F4E30; margin: 0; font-size: 24px; }
        .logout-btn { background-color: #ef4444; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; }
        .install-btn { background: #1F4E30; color: white; border: none; border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer; display: none; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 6px; color: #475569; font-weight: 500; font-size: 14px; }
        select, input[type="file"] { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background: white; width: 100%; box-sizing: border-box; }
        .file-picker { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 24px; text-align: center; background: #f8fafc; margin-bottom: 18px; }
        .file-picker p { margin: 0 0 12px; color: #475569; }
        .document-rows { display: flex; flex-direction: column; gap: 16px; margin: 18px 0; }
        .doc-row { border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; background: #f8fafc; }
        .doc-row-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; color: #1e293b; font-weight: 600; }
        .doc-name { min-width: 0; overflow-wrap: anywhere; color: #475569; font-size: 13px; font-weight: 400; text-align: right; }
        .doc-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .submit-btn { width: 100%; padding: 12px; background-color: #1F4E30; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .submit-btn:hover { background-color: #163621; }
        .submit-btn:disabled { opacity: .65; cursor: wait; }
        #uploadStatus { margin: 12px 0; color: #475569; }
        .history-section { margin-top: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; white-space: nowrap; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #f1f5f9; color: #475569; }
        .delete-btn { background-color: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .delete-btn:hover { background-color: #b91c1c; }
        @media (max-width: 768px) {
            body { padding: 10px; }
            .dashboard-container { padding: 15px; margin: 10px auto; }
            .doc-row-grid { grid-template-columns: 1fr; gap: 12px; }
            .header { align-items: flex-start; gap: 12px; }
        }
    </style>
</head>
<body>
    <main class="dashboard-container">
        <div class="header">
            <div>
                <h1>Teacher Submission Portal</h1>
                <p style="color: #64748b; margin: 4px 0 0;">The Noble Standard Schools Workspace</p>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <button id="installBtn" class="install-btn" type="button">Install App</button>
                <a href="/auth.html#login" class="logout-btn">Log Out</a>
            </div>
        </div>

        <form id="multiUploadForm">
            <div class="file-picker">
                <label for="fileInput">Choose Microsoft Word exam documents (.docx)</label>
                <input type="file" id="fileInput" accept=".docx" multiple>
                <p style="font-size:13px; margin:10px 0 0;">Select multiple files; enter class, subject, session, term, and time separately for each document.</p>
            </div>
            <div id="documentRows" class="document-rows" aria-live="polite"></div>
            <p id="uploadStatus" role="status" aria-live="polite"></p>
            <button id="submitButton" type="submit" class="submit-btn">Compile &amp; Submit All Documents</button>
        </form>

        <section class="history-section">
            <h2>Your Submissions Log</h2>
            <div style="width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; display:block; margin-top:15px;">
                <table>
                    <thead><tr><th>Subject</th><th>Class</th><th>Session</th><th>Term</th><th>Action</th></tr></thead>
                    <tbody id="history-rows">
                        <tr><td colspan="5" style="text-align:center; color:#94a3b8;">Loading past data entries...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const customCurriculum = {
            JSS_NEW: ["English Language", "Mathematics", "Yoruba", "Intermediate Science", "PHE", "Digital Technologies", "IRS", "History", "Social and Citizenship Studies", "Business Studies", "Arabic", "Fine Arts"],
            JSS3_TRADITIONAL: ["English Language", "Mathematics", "Yoruba", "Basic Science", "Basic Technology", "PHE", "Computer Studies", "IRS", "History", "Social Studies", "Civic Education", "Business Studies"],
            SSS: ["English Language", "Mathematics", "Livestock (Trade Subject)", "Citizenship Studies and Heritage Studies", "Digital Technologies", "IRS 1", "Quran", "Physics", "Literature", "Commerce", "Accounting", "Biology"]
        };
        const classOptions = ["JSS 1", "JSS 2", "JSS 3", "SSS 1", "SSS 2", "SSS 3"];
        const sessionOptions = ["2025/2026", "2026/2027"];
        const termOptions = ["First Term", "Second Term", "Third Term"];
        const durationOptions = ["45 Minutes", "1 Hour", "1 Hour 15 Minutes", "1 Hour 30 Minutes", "2 Hours", "2 Hours 30 Minutes", "3 Hours"];
        const fileInput = document.getElementById('fileInput');
        const rowsContainer = document.getElementById('documentRows');
        const form = document.getElementById('multiUploadForm');
        const submitButton = document.getElementById('submitButton');
        const uploadStatus = document.getElementById('uploadStatus');
        let selectedFiles = [];

        function makeSelect(labelText, options, name, placeholder) {
            const group = document.createElement('div');
            group.className = 'form-group';
            const label = document.createElement('label');
            label.textContent = labelText;
            const select = document.createElement('select');
            select.name = name;
            select.required = true;
            const first = document.createElement('option');
            first.value = '';
            first.textContent = placeholder || `-- Select ${labelText} --`;
            select.appendChild(first);
            (options || []).forEach(value => {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = value;
                select.appendChild(option);
            });
            group.append(label, select);
            return { group, select };
        }

        function subjectsForClass(className) {
            if (!className) return [];
            if (className === 'JSS 3') return customCurriculum.JSS3_TRADITIONAL;
            if (className.startsWith('JSS')) return customCurriculum.JSS_NEW;
            return customCurriculum.SSS;
        }

        function renderDocumentRows() {
            rowsContainer.replaceChildren();
            selectedFiles.forEach((file, index) => {
                const card = document.createElement('section');
                card.className = 'doc-row';
                const header = document.createElement('div');
                header.className = 'doc-row-header';
                const title = document.createElement('span');
                title.textContent = `Document ${index + 1}`;
                const filename = document.createElement('span');
                filename.className = 'doc-name';
                filename.textContent = file.name;
                header.append(title, filename);
                const grid = document.createElement('div');
                grid.className = 'doc-row-grid';

                const grade = makeSelect('Class / Grade', classOptions, `grade_${index}`, '-- Select Class --');
                const subject = makeSelect('Subject Name', [], `subject_${index}`, '-- Select Class First --');
                grade.select.addEventListener('change', () => {
                    const first = subject.select.options[0];
                    subject.select.replaceChildren(first);
                    first.textContent = grade.select.value ? '-- Select Subject --' : '-- Select Class First --';
                    subjectsForClass(grade.select.value).forEach(name => {
                        const option = document.createElement('option');
                        option.value = name;
                        option.textContent = name.toUpperCase();
                        subject.select.appendChild(option);
                    });
                });
                const session = makeSelect('Academic Session', sessionOptions, `session_year_${index}`);
                const term = makeSelect('Examination Term', termOptions, `term_${index}`);
                const duration = makeSelect('Time Allowed', durationOptions, `duration_${index}`);
                duration.group.style.gridColumn = 'span 2';
                grid.append(grade.group, subject.group, session.group, term.group, duration.group);
                card.append(header, grid);
                rowsContainer.appendChild(card);
            });
            if (!selectedFiles.length) {
                const empty = document.createElement('p');
                empty.style.color = '#64748b';
                empty.textContent = 'Choose one or more .docx files to enter their details.';
                rowsContainer.appendChild(empty);
            }
        }

        fileInput.addEventListener('change', () => {
            selectedFiles = Array.from(fileInput.files || []);
            uploadStatus.textContent = '';
            renderDocumentRows();
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();
            if (!selectedFiles.length) {
                uploadStatus.textContent = 'Choose at least one .docx file first.';
                return;
            }

            const cards = Array.from(rowsContainer.querySelectorAll('.doc-row'));
            const documentMetadata = selectedFiles.map((file, index) => {
                const card = cards[index];
                if (!card) throw new Error('Missing metadata row for file.');
                const metadata = {
                    subject: card.querySelector(`[name="subject_${index}"]`).value,
                    grade: card.querySelector(`[name="grade_${index}"]`).value,
                    session_year: card.querySelector(`[name="session_year_${index}"]`).value,
                    term: card.querySelector(`[name="term_${index}"]`).value,
                    duration: card.querySelector(`[name="duration_${index}"]`).value
                };
                if (Object.values(metadata).some(value => !value)) {
                    throw new Error(`Please complete all fields for ${file.name}.`);
                }
                return metadata;
            });

            const formData = new FormData();
            selectedFiles.forEach(file => formData.append('examFiles', file, file.name));
            formData.append('documents', JSON.stringify(documentMetadata));

            submitButton.disabled = true;
            uploadStatus.textContent = `Uploading ${selectedFiles.length} document(s)…`;

            try {
                const response = await fetch('/api/upload-exam', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(result.error || 'Upload failed.');
                }

                uploadStatus.textContent = result.message || `Successfully uploaded ${result.uploaded?.length || selectedFiles.length} document(s).`;
                selectedFiles = [];
                fileInput.value = '';
                renderDocumentRows();
                loadHistory();
            } catch (error) {
                uploadStatus.textContent = error.message;
            } finally {
                submitButton.disabled = false;
            }
        });

        async function loadHistory() {
            try {
                const response = await fetch('/api/teacher-history');
                const data = await response.json();
                const tbody = document.getElementById('history-rows');
                if (!data.length) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8;">No past exam papers found.</td></tr>';
                    return;
                }
                tbody.innerHTML = data.map(row => `
                    <tr>
                        <td><strong>${row.subject.toUpperCase()}</strong></td>
                        <td>${row.grade}</td>
                        <td>${row.session_year}</td>
                        <td>${row.term}</td>
                        <td><button class="delete-btn" onclick="deleteSubmission('${row.id}')">Delete</button></td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Error logging history rows:', err);
            }
        }

        async function deleteSubmission(examId) {
            if (!confirm('Are you sure you want to delete this exam submission from the school database?')) return;
            try {
                const response = await fetch('/api/delete-exam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ examId })
                });
                const result = await response.json();
                if (result.success) {
                    alert(result.message);
                    loadHistory();
                } else alert('Deletion Failed: ' + result.error);
            } catch (err) {
                alert('Server connection error during deletion.');
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.error('Service worker registration failed:', err));
            });
        }
        let deferredPrompt = null;
        const installButton = document.getElementById('installBtn');
        window.addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            deferredPrompt = event;
            if (installButton) installButton.style.display = 'inline-block';
        });
        if (installButton) {
            installButton.addEventListener('click', async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const choice = await deferredPrompt.userChoice;
                if (choice.outcome === 'accepted') console.log('PWA install accepted');
                deferredPrompt = null;
                installButton.style.display = 'none';
            });
        }
        window.addEventListener('load', loadHistory);
        renderDocumentRows();
    </script>
</body>
</html>
