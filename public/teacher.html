<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal - The Noble Standard Schools</title>
    <meta name="theme-color" content="#1F4E30">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon-192.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon-192.svg">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; }
        .dashboard-container { max-width: 850px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 25px; }
        h1 { color: #1F4E30; margin: 0; font-size: 24px; }
        .logout-btn { background-color: #ef4444; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; }
        .install-btn {
            background: #1F4E30; color: white; border: none; border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer; display: none;
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 6px; color: #475569; font-weight: 500; font-size: 14px; }
        select, input[type="text"] { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background: white; width: 100%; box-sizing: border-box; }
        .upload-area { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 30px; text-align: center; background-color: #f8fafc; cursor: pointer; margin-bottom: 20px; }
        .submit-btn { width: 100%; padding: 12px; background-color: #1F4E30; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .submit-btn:hover { background-color: #163621; }
        .history-section { margin-top: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; white-space: nowrap; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #f1f5f9; color: #475569; }
        .delete-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }
        .delete-btn:hover { background-color: #b91c1c; }
        @media (max-width: 768px) {
            body { padding: 10px; }
            .dashboard-container { padding: 15px; margin: 10px auto; }
            .form-grid { grid-template-columns: 1fr; gap: 12px; }
            .form-group[style*="grid-column"] { grid-column: span 1 !important; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <div>
                <h1>Teacher Submission Portal</h1>
                <p style="color: #64748b; margin: 4px 0 0 0;">The Noble Standard Schools Workspace</p>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <button id="installBtn" class="install-btn" type="button">Install App</button>
                <a href="/auth.html#login" class="logout-btn">Log Out</a>
            </div>
        </div>

        <form action="/api/upload-exam" method="POST" enctype="multipart/form-data">
            <div class="form-grid">
                <div class="form-group">
                    <label>Class / Grade</label>
                    <select id="classSelect" name="grade" required onchange="updateSubjects()">
                        <option value="">-- Select Class --</option>
                        <option value="JSS 1">JSS 1</option>
                        <option value="JSS 2">JSS 2</option>
                        <option value="JSS 3">JSS 3 (Traditional Curriculum)</option>
                        <option value="SSS 1">SSS 1</option>
                        <option value="SSS 2">SSS 2</option>
                        <option value="SSS 3">SSS 3</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Subject Name</label>
                    <select id="subjectSelect" name="subject" required>
                        <option value="">-- First Select Class Above --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Academic Session</label>
                    <select name="session_year" required>
                        <option value="2025/2026">2025/2026</option>
                        <option value="2026/2027">2026/2027</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Examination Term</label>
                    <select name="term" required>
                        <option value="First Term">First Term</option>
                        <option value="Second Term">Second Term</option>
                        <option value="Third Term">Third Term</option>
                    </select>
                </div>

                <div class="form-group" style="grid-column: span 2;">
                    <label>Time Allowed</label>
                    <select name="duration" required>
                        <option value="45 Minutes">45 Minutes</option>
                        <option value="1 Hour">1 Hour</option>
                        <option value="1 Hour 15 Minutes">1 Hour 15 Minutes</option>
                        <option value="1 Hour 30 Minutes">1 Hour 30 Minutes</option>
                        <option value="2 Hours">2 Hours</option>
                        <option value="2 Hours 30 Minutes">2 Hours 30 Minutes</option>
                        <option value="3 Hours">3 Hours</option>
                    </select>
                </div>
            </div>

            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <p style="margin:0; color:#475569;">📄 Click here to choose your Microsoft Word (.docx) exam file</p>
                <input type="file" id="fileInput" name="examFile" accept=".docx" required style="display:none;" onchange="document.getElementById('filename').innerText='Selected File: '+this.files[0].name">
                <div id="filename" style="margin-top:10px; color:#1F4E30; font-weight:bold;"></div>
            </div>

            <button type="submit" class="submit-btn">Compile & Submit Layout</button>
        </form>

        <div class="history-section">
            <h2>Your Submissions Log</h2>
            <div style="width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; display: block; margin-top: 15px;">
                <table>
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Class</th>
                            <th>Session</th>
                            <th>Term</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="history-rows">
                        <tr>
                            <td colspan="5" style="text-align:center; color:#94a3b8;">Loading past data entries...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const customCurriculum = {
            "JSS_NEW": ["English Language", "Mathematics", "Yoruba", "Intermediate Science", "PHE", "Digital Technologies", "IRS", "History", "Social and Citizenship Studies", "Business Studies", "Arabic", "Fine Arts"],
            "JSS3_TRADITIONAL": ["English Language", "Mathematics", "Yoruba", "Basic Science", "Basic Technology", "PHE", "Computer Studies", "IRS", "History", "Social Studies", "Civic Education", "Business Studies"],
            "SSS": ["English Language", "Mathematics", "Livestock (Trade Subject)", "Citizenship Studies and Heritage Studies", "Digital Technologies", "IRS 1", "Quran", "Physics", "Literature", "Commerce", "Accounting", "Biology"]
        };

        function updateSubjects() {
            const classVal = document.getElementById("classSelect").value;
            const subjectSelect = document.getElementById("subjectSelect");
            subjectSelect.innerHTML = '<option value="">-- Select Subject --</option>';
            if (!classVal) return;

            let targetKey = "SSS";
            if (classVal === "JSS 3") targetKey = "JSS3_TRADITIONAL";
            else if (classVal.startsWith("JSS")) targetKey = "JSS_NEW";

            customCurriculum[targetKey].forEach(subject => {
                const opt = document.createElement("option");
                opt.value = subject;
                opt.text = subject.toUpperCase();
                subjectSelect.appendChild(opt);
            });
        }

        async function loadHistory() {
            try {
                const response = await fetch('/api/teacher-history');
                const data = await response.json();
                const tbody = document.getElementById('history-rows');

                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8;">No past exam papers found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(row => `
                    <tr>
                        <td><strong>${row.subject.toUpperCase()}</strong></td>
                        <td>${row.grade}</td>
                        <td>${row.session_year}</td>
                        <td>${row.term}</td>
                        <td>
                            <button class="delete-btn" onclick="deleteSubmission('${row.id}')">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Error logging history rows:", err);
            }
        }

        async function deleteSubmission(examId) {
            if (!confirm("Are you sure you want to delete this exam submission from the school database?")) return;

            try {
                const response = await fetch('/api/delete-exam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ examId: examId })
                });
                const result = await response.json();

                if (result.success) {
                    alert(result.message);
                    loadHistory();
                } else {
                    alert("Deletion Failed: " + result.error);
                }
            } catch (err) {
                alert("Server connection error during deletion.");
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch((err) => console.error('Service worker registration failed:', err));
            });
        }

        let deferredPrompt = null;
        const installButton = document.getElementById('installBtn');
        window.addEventListener('beforeinstallprompt', (event) => {
            event.preventDefault();
            deferredPrompt = event;
            if (installButton) installButton.style.display = 'inline-block';
        });

        if (installButton) {
            installButton.addEventListener('click', async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const choice = await deferredPrompt.userChoice;
                if (choice.outcome === 'accepted') console.log('PWA install accepted');
                deferredPrompt = null;
                installButton.style.display = 'none';
            });
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
